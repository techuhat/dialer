android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# Project lives on D: while the Pub cache lives on C:. Kotlin's incremental
# compiler tries to relativize plugin source paths (C:) against the build dir
# (D:) and crashes with "this and base files have different roots". Disabling
# incremental Kotlin compilation avoids that code path. Release builds compile
# fully regardless, so this has no practical downside here.
kotlin.incremental=false
