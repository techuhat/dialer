name: umar_dailer
description: "Umar Dialer: an Android default-dialer app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_contacts: ^1.1.8
  image_picker: ^1.0.7
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  provider: ^6.1.1
  share_plus: ^7.2.1
  shared_preferences: ^2.3.1
  sqflite: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  image: ^4.1.7

flutter:
  uses-material-design: true

# Android icons are drawn by tool/app_icon_test.dart from the dial's own mark; this makes iOS's.
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/brand/app_icon_ios.png"
  remove_alpha_ios: true
